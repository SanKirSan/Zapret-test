name: Build and test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required files
        shell: bash
        run: |
          set -e

          required_files=(
            VERSION
            RELEASE
            Makefile
            zapret-test
            install.sh
            bootstrap.sh
            build.sh
            config
            requirements.conf
            services.conf
            domain-sources.conf
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: required file is missing: $file"
              exit 1
            fi
          done

          echo "All required files are present."

      - name: Shell syntax check
        shell: bash
        run: |
          set -e

          scripts=(
            zapret-test
            install.sh
            bootstrap.sh
            build.sh
          )

          for script in "${scripts[@]}"; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

          echo "Shell syntax check passed."

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        shell: bash
        run: |
          set -e

          scripts=(
            zapret-test
            install.sh
            bootstrap.sh
            build.sh
          )

          for script in "${scripts[@]}"; do
            echo "ShellCheck: $script"

            shellcheck               --shell=bash               --severity=error               "$script"
          done

          echo "ShellCheck passed."

      - name: Verify version consistency
        shell: bash
        run: |
          set -e

          VERSION="$(tr -d '[:space:]' < VERSION)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION is empty"
            exit 1
          fi

          echo "Expected version: $VERSION"

          grep -F "$VERSION" RELEASE
          grep -F "$VERSION" README.md
          grep -F "$VERSION" CHANGELOG.md
          grep -F "$VERSION" zapret-test

          echo "Version consistency check passed."

      - name: Validate Makefile
        shell: bash
        run: |
          set -e

          echo "Checking Makefile syntax and target database..."

          make -qp >/tmp/makefile-database.txt

          grep -q '^check:' Makefile
          grep -q '^distcheck:' Makefile

          echo "Makefile parsed successfully."
          echo "Targets found:"
          grep -E '^(check|distcheck):' Makefile

      - name: Verify source tree
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          find .             -maxdepth 2             -type f             ! -path './.git/*'             | sort

      - name: Verify release metadata
        shell: bash
        run: |
          set -e

          VERSION="$(tr -d '[:space:]' < VERSION)"

          echo "VERSION=$VERSION"
          echo "RELEASE:"
          cat RELEASE

          echo
          echo "Git commit:"
          git log -1 --oneline

      - name: CI summary
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "          ZAPRET-TEST CI SUMMARY"
          echo "========================================"

          if [ -f VERSION ]; then
            echo "Version : $(tr -d '[:space:]' < VERSION)"
          else
            echo "Version : unknown"
          fi

          echo "Commit  : $GITHUB_SHA"
          echo "Branch  : $GITHUB_REF_NAME"

          echo
          echo "Generated artifacts:"

          find .             -type f             \(               -name '*.tar.gz'               -o -name '*.tar.xz'               -o -name '*.tar.bz2'               -o -name '*.zip'             \)             -print
