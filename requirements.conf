# zapret-test 0.6.6 runtime requirements
# command|OpenWrt apk|opkg|apt|dnf/yum|pacman|zypper|Alpine apk|mode|required purpose
bash|bash|bash|bash|bash|bash|bash|bash|REQUIRED|shell runtime and zapret/blockcheck compatibility
curl|curl|curl|curl|curl|curl|curl|curl|REQUIRED|HTTP/HTTPS, API, downloads and list updates
wget|wget|wget|wget|wget|wget|wget|wget|REQUIRED|downloads and fallback list updates
jq|jq|jq|jq|jq|jq|jq|jq|REQUIRED|JSON parsing for diagnostics
cksum|coreutils-cksum|coreutils-cksum|coreutils|coreutils|coreutils|coreutils|coreutils|REQUIRED|strategy/result fingerprinting
sha256sum|coreutils-sha256sum|coreutils-sha256sum|coreutils|coreutils|coreutils|coreutils|coreutils|REQUIRED|artifact/report integrity
stat|coreutils-stat|coreutils-stat|coreutils|coreutils|coreutils|coreutils|coreutils|REQUIRED|file/process diagnostics
sleep|coreutils-sleep|coreutils-sleep|coreutils|coreutils|coreutils|coreutils|coreutils|REQUIRED|process monitoring helpers
iperf3|iperf3|iperf3|iperf3|iperf3|iperf3|iperf3|iperf3|REQUIRED|native throughput diagnostics
dig|bind-dig|bind-dig|bind9-dnsutils|bind-utils|bind|bind-utils|bind-tools|REQUIRED|DNS and native diagnostics
nslookup|bind-nslookup|bind-nslookup|bind9-dnsutils|bind-utils|bind|bind-utils|bind-tools|REQUIRED|DNS fallback
host|bind-host|bind-host|bind9-dnsutils|bind-utils|bind|bind-utils|bind-tools|REQUIRED|DNS fallback
ncat|ncat|ncat|ncat|nmap-ncat|ncat|ncat|ncat|REQUIRED|TCP probes for zapret2 blockcheck (BusyBox nc is unsupported)
nc|netcat|netcat|netcat-openbsd|nmap-ncat|openbsd-netcat|netcat-openbsd|netcat-openbsd|OPTIONAL|non-BusyBox fallback only; zapret2 prefers ncat
sed|sed|sed|sed|sed|sed|sed|sed|REQUIRED|portable text parsing
awk|awk|awk|gawk|gawk|gawk|gawk|gawk|REQUIRED|portable parsing
openssl|openssl-util|openssl|openssl|openssl|openssl|openssl|openssl|REQUIRED|TLS direct diagnostics
tcpdump|tcpdump|tcpdump|tcpdump|tcpdump|tcpdump|tcpdump|tcpdump|REQUIRED|packet capture diagnostics
